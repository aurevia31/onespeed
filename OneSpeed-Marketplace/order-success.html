<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed – OneSpeed Market</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header" id="site-header"></header>
  <main class="container">
    <div id="content" class="auth-container" style="max-width:560px;">
      <div class="spinner"></div>
    </div>
  </main>
  <footer class="footer" id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const id = getQueryParam('id');
      const content = document.getElementById('content');
      let order;
      let remoteOrder = false;
      try {
        if (window.OneSpeedBackend?.configured() && /^[0-9a-f-]{36}$/i.test(id || '')) {
          order = await OneSpeedBackend.getOrder(id);
          remoteOrder = true;
        } else {
          order = OSM.getOrder(id);
        }
      } catch (error) {
        content.innerHTML = `<div class="card auth-card"><h2>Could not load your order</h2><p>${escapeHTML(error.message)}</p><a href="index.html" class="btn btn-primary btn-block mt-3">Home</a></div>`;
        return;
      }
      if (!order) {
        content.innerHTML = '<div class="card auth-card"><h2>Order not found</h2><a href="index.html" class="btn btn-primary btn-block mt-3">Home</a></div>';
        return;
      }
      content.innerHTML = `
        <div class="card auth-card" style="text-align:center;">
          <div class="success-mark" role="img" aria-label="Order successful"></div>
          <h2 style="color:var(--secondary);">Order Placed Successfully!</h2>
          <p style="color:var(--text-light);margin:12px 0;">Thank you for shopping with OneSpeed Market.</p>
          <div class="card" style="padding:20px;margin:20px 0;text-align:left;background:linear-gradient(145deg,#f0e8d8,#e8e0d0);">
            <p><strong>Order ID:</strong> #${remoteOrder ? order.order_number : order.id}</p>
            <p><strong>Status:</strong> <span class="status status-pending">${remoteOrder ? order.status.replaceAll('_', ' ') : 'Pending Admin Approval'}</span></p>
            <p><strong>Total:</strong> ${remoteOrder ? `${order.currency} ${Number(order.total).toFixed(2)}` : OSM.formatPrice(order.total)}</p>
            <p><strong>Tracking:</strong> Will be provided after confirmation</p>
            <p style="font-size:0.85rem;color:var(--text-light);margin-top:8px;">You will receive updates once the admin approves and ships your order.</p>
          </div>
          ${remoteOrder ? '' : `<a href="track.html?id=${order.id}" class="btn btn-primary btn-block">Track This Order</a>`}
          ${remoteOrder && order.status === 'pending_payment' ? `<a href="bank-transfer.html?order=${encodeURIComponent(order.id)}" class="btn btn-primary btn-block">Submit bank transfer</a>` : ''}
          <a href="account.html" class="btn btn-secondary btn-block mt-2">My Orders</a>
          <a href="index.html" class="btn btn-secondary btn-block mt-2">Continue Shopping</a>
        </div>
      `;
    });

    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[character]));
    }
  </script>
</body>
</html>
