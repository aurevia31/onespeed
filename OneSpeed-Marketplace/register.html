<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up – OneSpeed Market</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header" id="site-header"></header>
  <main class="container">
    <div class="auth-container">
      <div class="card auth-card">
        <h2>Create Account</h2>
        <p class="text-center" style="color:var(--text-light);margin-bottom:20px;font-size:0.9rem;">Join OneSpeed Market – Free forever</p>
        <form id="reg-form">
          <div class="form-group">
            <label>Full Name *</label>
            <input type="text" class="form-control" name="name" required>
          </div>
          <div class="form-group">
            <label>Email *</label>
            <input type="email" class="form-control" name="email" required>
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input type="tel" class="form-control" name="phone" placeholder="+234...">
          </div>
          <div class="form-group">
            <label>Account type *</label>
            <select class="form-control" name="accountType"><option value="customer">Customer</option><option value="seller">Seller</option></select>
          </div>
          <div class="form-group">
            <label>Password *</label>
            <input type="password" class="form-control" name="password" required minlength="6">
          </div>
          <div class="form-group">
            <label>Confirm Password *</label>
            <input type="password" class="form-control" name="confirm" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Create Account</button>
        </form>
        <p class="text-center mt-3" style="font-size:0.9rem;">Already have an account? <a href="login.html" style="color:var(--primary-dark);font-weight:700;">Login</a></p>
        <p class="text-center mt-2" style="font-size:0.8rem;color:var(--text-light);">New accounts require Admin verification before full access.</p>
      </div>
    </div>
  </main>
  <footer class="footer" id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('reg-form').addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      if (fd.get('password') !== fd.get('confirm')) {
        OSM.toast('Passwords do not match');
        return;
      }
      if (window.OneSpeedBackend?.configured()) {
        try {
          await OneSpeedBackend.signUp({ name: fd.get('name'), email: fd.get('email'), phone: fd.get('phone'), password: fd.get('password'), role: fd.get('accountType') });
          OSM.toast(fd.get('accountType') === 'seller' ? 'Account created. Complete seller onboarding after confirming your email.' : 'Account created. Check your email to confirm your address.');
          setTimeout(() => location.href = 'login.html', 1200);
        } catch (err) { OSM.toast(err.message || 'Unable to create account.'); }
        return;
      }
      const res = OSM.registerUser({ name: fd.get('name'), email: fd.get('email'), phone: fd.get('phone'), password: fd.get('password') });
      if (res.error) {
        OSM.toast(res.error);
        return;
      }
      OSM.toast('Demo account created locally. Configure Supabase before public deployment.');
      setTimeout(() => location.href = 'login.html', 1200);
    });
  </script>
</body>
</html>
