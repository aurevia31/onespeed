<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account – OneSpeed Market</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header" id="site-header"></header>
  <main class="container">
    <h1 class="section-title">My Account</h1>
    <div id="account-content"><div class="spinner"></div></div>
  </main>
  <footer class="footer" id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      let session = OSM.getSession();
      let user;
      let orders;
      let remoteOrders = false;
      let authUser = null;
      let profile = null;
      let sellerStatus = 'not_applied';
      let sellerReviewNote = '';
      if (window.OneSpeedBackend?.configured()) {
        try {
          authUser = await OneSpeedBackend.currentUser();
          if (!authUser) {
            location.href = 'login.html?redirect=account.html';
            return;
          }
          profile = await OneSpeedBackend.profile();
          session = { id: authUser.id, role: profile?.role };
          user = {
            name: profile?.full_name || '',
            email: authUser.email,
            phone: profile?.phone,
            verified: Boolean(authUser.email_confirmed_at),
            createdAt: profile?.created_at
          };
          sellerStatus = profile?.seller_status || 'not_applied';
          const { data: sellerApplication, error: sellerApplicationError } = await OneSpeedBackend.client()
            .from('seller_profiles').select('review_note').eq('user_id', authUser.id).maybeSingle();
          if (sellerApplicationError) throw sellerApplicationError;
          sellerReviewNote = sellerApplication?.review_note || '';
          orders = await OneSpeedBackend.listCustomerOrders(authUser.id);
          remoteOrders = true;
        } catch (error) {
          document.getElementById('account-content').innerHTML =
            `<div class="card" style="padding:24px;">Could not load your account: ${escapeHTML(error.message)}</div>`;
          return;
        }
      } else {
        if (!requireLogin()) return;
        user = OSM.getUser(session.id);
        orders = OSM.getUserOrders(session.id);
      }
      if (session.role === 'admin') {
        location.replace('/');
        return;
      }

      let ordersHTML = orders.length === 0
        ? '<p style="color:var(--text-light);">No orders yet. <a href="index.html">Start shopping</a></p>'
        : `<div class="table-wrap"><table>
            <thead><tr><th>Order</th><th>Date</th><th>Total</th><th>Status</th><th></th></tr></thead>
            <tbody>
              ${orders.map(o => `
                <tr>
                  <td>#${escapeHTML(remoteOrders ? o.order_number : o.id)}</td>
                  <td>${new Date(remoteOrders ? o.created_at : o.createdAt).toLocaleDateString()}</td>
                  <td>${remoteOrders ? `${escapeHTML(o.currency)} ${Number(o.total).toFixed(2)}` : OSM.formatPrice(o.total)}</td>
                  <td><span class="status status-${escapeHTML(o.status)}">${escapeHTML(o.status)}</span></td>
                  <td><a href="${remoteOrders ? `order-success.html?id=${encodeURIComponent(o.id)}` : `track.html?id=${o.id}`}" class="btn btn-secondary btn-sm">${remoteOrders ? 'Details' : 'Track'}</a></td>
                </tr>`).join('')}
            </tbody></table></div>`;

      document.getElementById('account-content').innerHTML = `
        <div style="display:grid;grid-template-columns:280px 1fr;gap:24px;" class="account-grid">
          <div class="card" style="padding:24px;">
            <h3 style="margin-bottom:16px;">Profile</h3>
            <p><strong>Name:</strong> ${escapeHTML(user.name)}</p>
            <p><strong>Email:</strong> ${escapeHTML(user.email)}</p>
            <p><strong>Phone:</strong> ${escapeHTML(user.phone || '—')}</p>
            <p><strong>Status:</strong> ${user.verified ? '<span class="status status-approved">Verified</span>' : '<span class="status status-pending">Pending Verification</span>'}</p>
            ${remoteOrders ? `<form id="profile-form" class="profile-edit-form">
              <h3>Profile settings</h3>
              <label>Full name<input class="form-control" name="fullName" required maxlength="160" value="${escapeHTML(user.name)}"></label>
              <label>Phone<input class="form-control" name="phone" type="tel" maxlength="40" value="${escapeHTML(user.phone || '')}"></label>
              <button class="btn btn-secondary btn-sm" type="submit">Save profile</button>
              <p id="profile-status" role="status"></p>
            </form>` : ''}
            <p style="margin-top:14px;"><a href="addresses.html" class="btn btn-secondary btn-sm">Manage saved addresses</a></p>
            ${remoteOrders ? `<hr style="margin:18px 0;border:0;border-top:1px solid #eee;">
              <h3>Seller account</h3>
              <p><strong>Status:</strong> <span class="status status-${sellerStatus === 'approved' ? 'approved' : sellerStatus === 'rejected' ? 'rejected' : sellerStatus === 'pending' ? 'pending' : 'not_applied'}">${escapeHTML(sellerStatus.replace('_',' '))}</span></p>
              ${sellerStatus === 'rejected' && sellerReviewNote ? `<p>${escapeHTML(sellerReviewNote)}</p>` : ''}
              <p style="margin-top:12px;"><a href="seller.html" class="btn btn-secondary btn-sm">${sellerStatus === 'approved' ? 'Open Seller Centre' : sellerStatus === 'pending' ? 'Track application' : sellerStatus === 'rejected' ? 'Update and resubmit' : 'Become a Seller'}</a></p>
            ` : ''}
            ${user.createdAt ? `<p style="font-size:0.85rem;color:var(--text-light);margin-top:12px;">Member since ${new Date(user.createdAt).toLocaleDateString()}</p>` : ''}
          </div>
          <div>
            <h3 class="section-title" id="orders" style="font-size:1.2rem;">My Orders</h3>
            ${ordersHTML}
          </div>
        </div>
        ${remoteOrders ? `
          <section class="account-tools">
            <h2 class="section-title">Account services</h2>
            <div class="account-tools-grid">
              <a class="card account-tool" href="cart.html"><strong>My cart</strong><span>Review items before checkout.</span></a>
              <a class="card account-tool" href="track.html"><strong>Track an order</strong><span>Look up the latest order status.</span></a>
              <a class="card account-tool" href="wishlist.html"><strong>Wishlist</strong><span>Review products saved to your account.</span></a>
              <a class="card account-tool" href="addresses.html"><strong>Delivery addresses</strong><span>Manage private saved delivery details.</span></a>
              <a class="card account-tool" href="notifications.html"><strong>Notifications</strong><span>Order, seller application, payment, and support updates.</span></a>
              <a class="card account-tool" href="payment-history.html"><strong>Payment history</strong><span>View your bank-transfer submission status.</span></a>
              <a class="card account-tool" href="support.html"><strong>Customer support</strong><span>Open a support request and follow replies.</span></a>
              <a class="card account-tool" href="reset-password.html"><strong>Security settings</strong><span>Request a secure password reset.</span></a>
              ${sellerStatus === 'approved' ? '<a class="card account-tool" href="seller.html"><strong>Seller dashboard</strong><span>Manage your approved seller workspace.</span></a>' : sellerStatus === 'pending' ? '<a class="card account-tool" href="seller.html"><strong>Seller application status</strong><span>Check your application review status.</span></a>' : sellerStatus === 'rejected' ? '<a class="card account-tool" href="seller.html"><strong>Seller application</strong><span>Review feedback and resubmit your application.</span></a>' : '<a class="card account-tool" href="seller.html"><strong>Become a seller</strong><span>Apply to sell on OneSpeed Marketplace.</span></a>'}
              <button class="card account-tool account-logout" type="button" onclick="logout()"><strong>Log out</strong><span>Securely end this session.</span></button>
            </div>
          </section>
        ` : ''}
      `;
      document.getElementById('profile-form')?.addEventListener('submit', async event => {
        event.preventDefault();
        const form = event.currentTarget;
        const button = form.querySelector('button[type="submit"]');
        const status = document.getElementById('profile-status');
        button.disabled = true;
        try {
          const values = new FormData(form);
          const { error } = await OneSpeedBackend.client().from('profiles')
            .update({ full_name: String(values.get('fullName')).trim(), phone: String(values.get('phone') || '').trim() || null })
            .eq('id', authUser.id);
          if (error) throw error;
          status.textContent = 'Profile updated.';
        } catch (error) { status.textContent = error.message || 'Could not update profile.'; }
        finally { button.disabled = false; }
      });
    });

    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[character]));
    }
  </script>
  <style>@media(max-width:700px){.account-grid{grid-template-columns:1fr!important;}}</style>
</body>
</html>
