<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Products – OneSpeed Admin</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>html[data-admin-auth="checking"] body{visibility:hidden}</style>
  <script>document.documentElement.dataset.adminAuth = 'checking';</script>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo"><img src="../assets/images/onespeed-marketplace-brand.webp" alt="OneSpeed Marketplace Admin" width="180" height="45"></a>
      <div class="nav-actions">
        <a href="../index.html" class="btn btn-secondary btn-sm">View Store</a>
      </div>
    </div>
  </header>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="index.html">Dashboard</a>
      <a href="products.html" class="active">Products</a>
      <a href="orders.html">Orders</a>
      <a href="users.html">Users</a>
    </aside>
    <main class="admin-content">
      <div class="flex justify-between align-center mb-2" style="flex-wrap:wrap;gap:12px;">
        <h1 class="section-title" style="margin:0;">Products <span id="count" style="font-size:1rem;color:var(--text-light);"></span></h1>
        <input type="search" class="form-control" id="search" placeholder="Search products..." aria-label="Search products" style="max-width:260px;">
      </div>
      <div class="product-admin-filters"><label>Listing status
        <select class="form-control" id="status-filter"><option value="">All statuses</option><option>pending_review</option><option>active</option><option>draft</option><option>rejected</option><option>archived</option></select>
      </label></div>
      <p id="product-status" role="status">Loading products…</p>
      <div class="admin-product-grid" id="grid"></div>
      <nav class="admin-pagination" aria-label="Product pages">
        <button class="btn btn-secondary btn-sm" id="products-previous" type="button" disabled>Previous</button>
        <span id="products-page" aria-live="polite"></span>
        <button class="btn btn-secondary btn-sm" id="products-next" type="button" disabled>Next</button>
      </nav>
    </main>
  </div>

  <!-- Listing details and moderation -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Edit Product</h3>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <form id="product-form">
          <input type="hidden" name="id">
          <div class="form-group">
            <label>Title *</label>
            <input type="text" class="form-control" name="title" required>
          </div>
          <div class="form-group">
            <label>Price *</label>
            <input type="number" class="form-control" name="price" step="0.01" min="0" required>
          </div>
          <div class="form-group">
            <label>Category</label>
            <select class="form-control" name="category">
              <option>Electronics</option><option>Fashion</option><option>Home</option>
              <option>Sports</option><option>Toys</option><option>Beauty</option><option>Groceries</option><option>Automotive</option><option>Pets</option><option>Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>Stock</label>
            <input type="number" class="form-control" name="stock" min="0" value="100">
          </div>
          <div class="form-group">
            <label>Listing status</label>
            <select class="form-control" name="status"><option>draft</option><option>pending_review</option><option>active</option><option>rejected</option><option>archived</option></select>
          </div>
          <div class="form-group">
            <label>Moderation note (required when rejecting)</label>
            <textarea class="form-control" name="moderationNote" rows="2" maxlength="1000"></textarea>
          </div>
          <div class="form-group">
            <label>Product image URL</label>
            <input type="url" class="form-control" name="image" placeholder="https://... or upload an image below">
          </div>
          <div class="form-group">
            <label>Upload product image</label>
            <input type="file" class="form-control" id="image-upload" name="upload" accept="image/jpeg,image/png,image/webp,image/avif">
            <small class="form-help">Upload JPG, PNG, WebP or AVIF up to 5 MB to Supabase Storage, or use an image URL.</small>
            <img id="image-preview" class="admin-image-preview" src="../assets/images/product-placeholder.svg" alt="Product image preview" width="180" height="180">
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea class="form-control" name="description" rows="3"></textarea>
          </div>
          <div class="flex gap-2">
            <button type="submit" class="btn btn-primary" style="flex:1;">Save Product</button>
            <button type="button" class="btn btn-secondary" id="archive-btn" style="display:none;">Archive listing</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script src="../js/data.js"></script>
  <script>
    let products = [];
    let currentId = '';
    let productPage = 0;
    let productCount = 0;
    let loadSequence = 0;
    const pageSize = 30;
    const form = document.getElementById('product-form');
    const imageUpload = document.getElementById('image-upload');
    const imagePreview = document.getElementById('image-preview');
    const imageUrlInput = form.elements.image;
    const status = document.getElementById('product-status');
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const imageURL = value => {
      try {
        const url = new URL(value || '../assets/images/product-placeholder.svg', location.href);
        return url.protocol === 'https:' || (url.origin === location.origin && url.protocol === 'http:')
          ? url.href : '../assets/images/product-placeholder.svg';
      } catch { return '../assets/images/product-placeholder.svg'; }
    };

    async function loadProducts(resetPage = false) {
      if (resetPage) productPage = 0;
      const sequence = ++loadSequence;
      status.textContent = 'Loading products…';
      try {
        const db = OneSpeedBackend.client();
        let request = db.from('products')
          .select('id,title,description,price,currency,category,stock,image_url,seller_id,status,moderation_note,created_at', { count: 'exact' });
        const query = document.getElementById('search').value.trim();
        const filterStatus = document.getElementById('status-filter').value;
        if (query) request = request.textSearch('search_document', query, { type: 'websearch', config: 'english' });
        if (filterStatus) request = request.eq('status', filterStatus);
        const { data, error, count } = await request
          .order('created_at', { ascending: false })
          .order('id', { ascending: false })
          .range(productPage * pageSize, productPage * pageSize + pageSize - 1);
        if (error) throw error;
        if (sequence !== loadSequence) return;
        products = data;
        productCount = count || 0;
        const first = productCount ? productPage * pageSize + 1 : 0;
        const last = Math.min((productPage + 1) * pageSize, productCount);
        status.textContent = `Showing ${first}–${last} of ${productCount} products.`;
        document.getElementById('products-page').textContent = productCount
          ? `Page ${productPage + 1} of ${Math.ceil(productCount / pageSize)}` : 'No results';
        document.getElementById('products-previous').disabled = productPage === 0;
        document.getElementById('products-next').disabled = last >= productCount;
        renderGrid();
      } catch (error) {
        if (sequence !== loadSequence) return;
        status.textContent = error.message || 'Could not load products.';
        products = [];
        productCount = 0;
        renderGrid();
      }
    }

    function renderGrid() {
      document.getElementById('count').textContent = `(${productCount})`;
      document.getElementById('grid').innerHTML = products.map(product => `
        <button type="button" class="admin-product-tile" data-product="${esc(product.id)}">
          <img src="${esc(imageURL(product.image_url || product.images?.[0]))}" alt="" loading="lazy" onerror="this.onerror=null;this.src='../assets/images/product-placeholder.svg'">
          <span class="title">${esc(product.title)}</span>
          <span class="price">${esc(product.currency)} ${Number(product.price).toFixed(2)}</span>
          <span class="admin-product-meta">${esc(product.category)} · ${Number(product.stock)} in stock</span>
          <span class="status status-${product.status === 'active' ? 'approved' : product.status === 'rejected' ? 'rejected' : 'pending'}">${esc(product.status.replace('_',' '))}</span>
          ${product.moderation_note ? `<span class="admin-product-meta">${esc(product.moderation_note)}</span>` : ''}
          <span class="admin-product-meta">Seller ${esc(product.seller_id)}</span>
        </button>`).join('') || '<p class="page-state">No products match these filters.</p>';
    }

    function openEdit(id) {
      const product = products.find(item => item.id === id);
      if (!product) return;
      currentId = product.id;
      form.elements.id.value = product.id;
      form.elements.title.value = product.title;
      form.elements.price.value = product.price;
      form.elements.category.value = product.category || 'Other';
      form.elements.stock.value = product.stock;
      form.elements.status.value = product.status;
      form.elements.moderationNote.value = product.moderation_note || '';
      form.elements.image.value = product.image_url || '';
      form.elements.description.value = product.description || '';
      imageUpload.value = '';
      imagePreview.src = imageURL(product.image_url);
      document.getElementById('archive-btn').style.display = 'inline-flex';
      document.getElementById('modal').classList.add('show');
    }

    function closeModal() { document.getElementById('modal').classList.remove('show'); }

    imageUrlInput.addEventListener('input', () => {
      if (!imageUpload.files?.length) imagePreview.src = imageUrlInput.value || '../assets/images/product-placeholder.svg';
    });
    imageUpload.addEventListener('change', () => {
      const file = imageUpload.files?.[0];
      if (!file) return;
      if (!/^image\/(jpeg|png|webp|avif)$/.test(file.type) || file.size > 5 * 1024 * 1024) {
        OSM.toast('Choose a JPG, PNG, WebP or AVIF image up to 5 MB.');
        imageUpload.value = '';
        return;
      }
      imageUrlInput.value = '';
      imagePreview.src = URL.createObjectURL(file);
    });
    document.getElementById('grid').addEventListener('click', event => {
      const button = event.target.closest('[data-product]');
      if (button) openEdit(button.dataset.product);
    });
    let searchTimer;
    document.getElementById('search').addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => loadProducts(true), 250);
    });
    document.getElementById('status-filter').addEventListener('change', () => loadProducts(true));
    document.getElementById('products-previous').addEventListener('click', () => {
      if (productPage > 0) { productPage -= 1; loadProducts(); }
    });
    document.getElementById('products-next').addEventListener('click', () => {
      if ((productPage + 1) * pageSize < productCount) { productPage += 1; loadProducts(); }
    });
    document.getElementById('archive-btn').addEventListener('click', async () => {
      if (!currentId || !confirm('Archive this listing? It will no longer be available in the storefront.')) return;
      try {
        const { error } = await OneSpeedBackend.client().from('products').update({ status: 'archived' }).eq('id', currentId);
        if (error) throw error;
        closeModal();
        await loadProducts();
      } catch (error) { OSM.toast(error.message || 'Could not archive listing.'); }
    });
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!currentId) return;
      const button = event.submitter;
      button.disabled = true;
      try {
        const values = new FormData(form);
        const nextStatus = String(values.get('status'));
        const moderationNote = String(values.get('moderationNote') || '').trim();
        if (nextStatus === 'rejected' && moderationNote.length < 5) {
          OSM.toast('Add a clear rejection note of at least 5 characters.');
          return;
        }
        let imageUrl = String(values.get('image') || '').trim() || null;
        const file = values.get('upload');
        if (file?.size) imageUrl = (await OneSpeedBackend.uploadProductImage(file)).url;
        const { error } = await OneSpeedBackend.client().from('products').update({
          title: String(values.get('title')).trim(),
          price: Number(values.get('price')),
          category: String(values.get('category')).trim(),
          stock: Number(values.get('stock')),
          status: nextStatus,
          moderation_note: nextStatus === 'rejected' ? moderationNote : null,
          image_url: imageUrl,
          images: imageUrl ? [imageUrl] : [],
          description: String(values.get('description') || '').trim(),
          updated_at: new Date().toISOString()
        }).eq('id', currentId);
        if (error) throw error;
        closeModal();
        await loadProducts();
      } catch (error) { OSM.toast(error.message || 'Could not save product.'); }
      finally { button.disabled = false; }
    });
    document.getElementById('modal').addEventListener('click', event => {
      if (event.target.id === 'modal') closeModal();
    });
    document.querySelector('.modal-close').addEventListener('click', closeModal);
    OneSpeedAdmin.ready.then(admin => { if (admin) loadProducts(); });
  </script>
</body>
</html>
