<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bank Transfer Reviews – OneSpeed Admin</title><link rel="stylesheet" href="../css/styles.css"><style>html[data-admin-auth="checking"] body{visibility:hidden}.review-wrap{max-width:1200px;margin:28px auto;padding:0 18px}.review-card{padding:20px;margin-bottom:14px}.review-table{width:100%;border-collapse:collapse}.review-table th,.review-table td{text-align:left;padding:10px;border-bottom:1px solid #ddd}.review-actions{display:flex;gap:8px;flex-wrap:wrap}.review-actions button{padding:8px 12px}.status-note{font-size:.9rem;color:#666}</style><script>document.documentElement.dataset.adminAuth="checking";</script></head><body><header class="header" id="site-header"></header><main class="review-wrap"><h1>Bank transfer reviews</h1><p>Verify each transfer against the actual bank statement before approving it. Approval changes order status to paid; it does not move money or perform a bank transaction.</p><div id="review-state" class="card review-card">Loading transfer submissions…</div><div id="review-list"></div></main><footer class="footer" id="site-footer"></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script src="../js/supabase.js"></script><script src="../js/admin-auth.js"></script><script src="../js/data.js"></script><script src="../js/app.js"></script><script>
(async()=>{const state=document.getElementById('review-state'),list=document.getElementById('review-list');try{if(!OneSpeedBackend.configured()){state.textContent='Configure Supabase before reviewing payments.';return}const user=await OneSpeedBackend.currentUser();if(!user){state.textContent='Your administrator session is no longer valid. Please sign in again.';location.replace('/admin/login?redirect=%2Fadmin%2Fbank-transfers.html');return}const profile=await OneSpeedBackend.profile();if(profile?.role!=='admin'){state.textContent='Admin access required.';return}const db=OneSpeedBackend.client();const {data:rows,error}=await db.from('bank_transfer_submissions').select('id,order_id,customer_id,amount,currency,bank_reference,sender_name,proof_path,status,created_at,orders(order_number,total,status)').order('created_at',{ascending:false});if(error)throw error;state.textContent=rows.length+' transfer submission(s). Confirm funds in your bank account before approval.';list.innerHTML=rows.map(r=>`<article class="card review-card"><h3>${esc(r.orders?.order_number||r.order_id)}</h3><p><strong>Submitted:</strong> ${esc(new Date(r.created_at).toLocaleString())}</p><p><strong>Amount:</strong> ${esc(r.currency)} ${r.amount} · <strong>Reference:</strong> ${esc(r.bank_reference)}</p><p><strong>Sender:</strong> ${esc(r.sender_name)} · <strong>Order status:</strong> ${esc(r.orders?.status||'unknown')}</p><p><strong>Review status:</strong> ${esc(r.status)}</p><div class="review-actions">${r.proof_path?`<button class="btn btn-secondary" data-proof="${esc(r.proof_path)}">View receipt securely</button>`:''}${r.status==='pending_review'?`<button class="btn btn-primary" data-approve="${r.id}" data-order="${r.order_id}">Approve payment</button><button class="btn btn-secondary" data-reject="${r.id}">Reject</button>`:''}</div><p class="status-note" id="note-${r.id}"></p></article>`).join('')||'No transfer submissions yet.';list.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;b.disabled=true;try{if(b.dataset.proof){const {data,error}=await db.storage.from('transfer-proofs').createSignedUrl(b.dataset.proof,60);if(error)throw error;window.open(data.signedUrl,'_blank','noopener,noreferrer');b.disabled=false;return}if(b.dataset.approve){if(!confirm('Confirm you have verified the money has arrived in the official bank account?')){b.disabled=false;return}const {error}=await db.rpc('admin_review_bank_transfer',{p_submission_id:b.dataset.approve,p_approve:true,p_note:null});if(error)throw error;document.getElementById('note-'+b.dataset.approve).textContent='Approved and order marked paid.';b.closest('.review-actions').remove()}else if(b.dataset.reject){const note=prompt('Reason for rejection (required):');if(!note?.trim()){b.disabled=false;return}const {error}=await db.rpc('admin_review_bank_transfer',{p_submission_id:b.dataset.reject,p_approve:false,p_note:note.trim()});if(error)throw error;document.getElementById('note-'+b.dataset.reject).textContent='Transfer rejected: '+note;b.closest('.review-actions').remove()}}catch(err){alert(err.message||'Action failed');b.disabled=false}})}catch(err){state.textContent=err.message||'Unable to load transfer submissions'}})();function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
