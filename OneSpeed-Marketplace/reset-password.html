<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password recovery – OneSpeed Market</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header" id="site-header"></header>
  <main class="container">
    <div class="auth-container">
      <div class="card auth-card">
        <h2>Password recovery</h2>
        <p id="recovery-status" class="text-center mt-3" role="status" aria-live="polite"></p>
        <form id="request-form">
          <p>Enter your account email and, if an account is eligible, we will send a password reset link.</p>
          <div class="form-group">
            <label for="recovery-email">Email</label>
            <input id="recovery-email" type="email" class="form-control" name="email" required autocomplete="email">
          </div>
          <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
        </form>
        <form id="update-form" hidden>
          <div class="form-group">
            <label for="new-password">New password</label>
            <input id="new-password" type="password" class="form-control" name="password" required minlength="6" autocomplete="new-password">
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm new password</label>
            <input id="confirm-password" type="password" class="form-control" name="confirm" required minlength="6" autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block">Update password</button>
        </form>
        <p class="text-center mt-3"><a href="login.html">Return to customer login</a></p>
      </div>
    </div>
  </main>
  <footer class="footer" id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    const requestForm = document.getElementById('request-form');
    const updateForm = document.getElementById('update-form');
    const status = document.getElementById('recovery-status');
    const backend = window.OneSpeedBackend;

    function showPasswordForm() {
      requestForm.hidden = true;
      updateForm.hidden = false;
      status.textContent = 'Choose a new password for your account.';
    }

    if (!backend?.configured()) {
      status.textContent = 'Password recovery is unavailable until Supabase is configured.';
      requestForm.querySelector('button').disabled = true;
    } else {
      backend.client().auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY' || (event === 'INITIAL_SESSION' && session)) {
          showPasswordForm();
        }
      });
      backend.client().auth.getSession().then(({ data, error }) => {
        if (error) {
          status.textContent = 'Unable to check this reset link. Request a new link or try again later.';
        } else if (data.session) {
          showPasswordForm();
        }
      }).catch(() => {
        status.textContent = 'Unable to check this reset link. Request a new link or try again later.';
      });
    }

    requestForm.addEventListener('submit', async event => {
      event.preventDefault();
      if (!backend?.configured()) return;
      const email = new FormData(requestForm).get('email').trim();
      const button = requestForm.querySelector('button');
      button.disabled = true;
      try {
        await backend.requestPasswordReset(email);
        status.textContent = 'If an account can be recovered with that email, a reset link will be sent.';
        requestForm.reset();
      } catch {
        status.textContent = 'Unable to send a reset link right now. Check your email configuration and try again later.';
      } finally {
        button.disabled = false;
      }
    });

    updateForm.addEventListener('submit', async event => {
      event.preventDefault();
      const values = new FormData(updateForm);
      if (values.get('password') !== values.get('confirm')) {
        status.textContent = 'The passwords do not match.';
        return;
      }
      const button = updateForm.querySelector('button');
      button.disabled = true;
      try {
        await backend.updatePassword(String(values.get('password')));
        await backend.signOut();
        status.textContent = 'Your password has been updated. Return to customer login.';
        updateForm.reset();
      } catch {
        status.textContent = 'Unable to update the password. Request a new reset link and try again.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
