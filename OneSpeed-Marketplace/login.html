<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – OneSpeed Market</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header" id="site-header"></header>
  <main class="container">
    <div class="auth-container">
      <div class="card auth-card">
        <h2>Login to OneSpeed</h2>
        <p class="text-center" style="color:var(--text-light);margin-bottom:20px;font-size:0.9rem;">Unlock prices & start shopping</p>
        <form id="login-form">
          <div class="form-group">
            <label>Email</label>
            <input type="email" class="form-control" name="email" required placeholder="you@example.com">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-control" name="password" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
        <p class="text-center mt-3" style="font-size:0.9rem;">Don't have an account? <a href="register.html" style="color:var(--primary-dark);font-weight:700;">Sign Up</a></p>
        <p id="auth-mode-note" class="text-center mt-3" style="font-size:0.8rem;color:var(--text-light);">Sign in securely to access your account.</p>
      </div>
    </div>
  </main>
  <footer class="footer" id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (!window.OneSpeedBackend?.configured()) document.getElementById('auth-mode-note').textContent = 'Local demo mode only. Configure Supabase before public deployment; demo credentials are not production-safe.';
    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      if (window.OneSpeedBackend?.configured()) {
        try {
          const result = await OneSpeedBackend.signIn(fd.get('email'), fd.get('password'));
          const profile = await OneSpeedBackend.profile();
          if (!profile || !profile.is_active) throw new Error('Your account is inactive. Contact support.');
          if (profile.role === 'seller' && profile.seller_status !== 'approved') throw new Error('Your seller account is awaiting approval.');
          OSM.toast('Welcome back!');
          const fallback = profile.role === 'admin' ? 'admin/index.html' : profile.role === 'seller' ? 'seller.html' : 'index.html';
          setTimeout(() => location.href = getQueryParam('redirect') || fallback, 500);
        } catch (err) { OSM.toast(err.message || 'Unable to sign in.'); }
        return;
      }
      OSM.toast('Demo mode is active. Configure Supabase before public deployment.');
      const res = OSM.login(fd.get('email'), fd.get('password'));
      if (res.error) { OSM.toast(res.error); return; }
      OSM.toast('Demo sign-in successful.');
      const redirect = getQueryParam('redirect') || (res.user.role === 'admin' ? 'admin/index.html' : 'index.html');
      setTimeout(() => location.href = redirect, 600);
    });
  </script>
</body>
</html>
