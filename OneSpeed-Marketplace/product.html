<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product – OneSpeed Market</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .product-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    @media (max-width: 768px) { .product-detail { grid-template-columns: 1fr; } }
    .gallery img { width: 100%; border-radius: 16px; box-shadow: var(--shadow-deep); background: #e0d8c8; }
    .price-big { font-size: 2rem; font-weight: 800; color: var(--primary-dark); margin: 12px 0; }
    .qty-control { display: flex; align-items: center; gap: 12px; margin: 16px 0; }
    .qty-control button { width: 40px; height: 40px; border-radius: 10px; font-size: 1.2rem; }
    .qty-control input { width: 60px; text-align: center; font-size: 1.1rem; font-weight: 700; }
  </style>
</head>
<body>
  <header class="header" id="site-header"></header>
  <main class="container">
    <div id="product-content">
      <div class="spinner"></div>
    </div>
  </main>
  <footer class="footer" id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const id = getQueryParam('id');
      const content = document.getElementById('product-content');
      let p = OSM.getProduct(id);
      let authenticated = Boolean(OSM.getSession());
      if (window.OneSpeedBackend?.configured()) {
        try {
          const [remoteProduct, user] = await Promise.all([
            OneSpeedBackend.getProduct(id),
            OneSpeedBackend.currentUser()
          ]);
          p = remoteProduct ? toStorefrontProduct(remoteProduct) : null;
          authenticated = Boolean(user);
          if (p) {
            const products = OSM.getProducts().filter(product => String(product.id) !== String(p.id));
            OSM.saveProducts([p, ...products]);
          }
        } catch (error) {
          content.innerHTML = `<div class="card" style="padding:40px;text-align:center;"><h2>Could not load product</h2><p>${escapeHTML(error.message)}</p><a href="index.html" class="btn btn-primary mt-3">Back to Marketplace</a></div>`;
          return;
        }
      }
      if (!p) {
        content.innerHTML = '<div class="card" style="padding:40px;text-align:center;"><h2>Product not found</h2><a href="index.html" class="btn btn-primary mt-3">Back to Marketplace</a></div>';
        return;
      }
      document.title = p.title + ' – OneSpeed Market';
      const isGuest = !authenticated;
      const stock = Math.max(0, Number(p.stock) || 0);

      content.innerHTML = `
        <div class="product-detail">
          <div class="gallery">
            <img src="${escapeHTML(safeImageURL(p.image))}" alt="${escapeHTML(p.title)}" width="600" height="600" loading="eager" onerror="this.src='assets/images/product-placeholder.svg'">
          </div>
          <div>
            <div class="badge">${escapeHTML(p.category)}</div>
            <h1 style="font-size:1.6rem;margin:12px 0;color:var(--secondary);">${escapeHTML(p.title)}</h1>
            <div class="product-detail-meta">
              <span>${stock > 0 ? `${stock} in stock` : '<span class="status status-rejected">Out of stock</span>'}</span>
            </div>
            ${isGuest 
              ? `<div class="price-big locked-price" style="display:inline-block;">Login to unlock price</div>
                 <p class="mt-2" style="color:var(--text-light);">Create a free account or login to see prices and purchase.</p>
                 <div class="mt-3" style="display:flex;gap:12px;">
                   <a href="login.html?redirect=${encodeURIComponent(`product.html?id=${p.id}`)}" class="btn btn-primary">Login</a>
                   <a href="register.html" class="btn btn-secondary">Sign Up Free</a>
                 </div>`
              : `<div class="price-big">${formatProductPrice(p)}</div>
                 ${stock > 0 ? `<div class="qty-control">
                   <button class="btn btn-secondary" aria-label="Decrease quantity" onclick="changeQty(-1)">−</button>
                   <input type="number" id="qty" value="1" min="1" max="${stock}" class="form-control" aria-label="Quantity">
                   <button class="btn btn-secondary" aria-label="Increase quantity" onclick="changeQty(1)">+</button>
                 </div>` : ''}
                 <button class="btn btn-primary btn-block" style="padding:16px;font-size:1.1rem;" onclick="addToCart()" ${stock > 0 ? '' : 'disabled'}>Add to Cart</button>
                 <button class="btn btn-accent btn-block mt-2" onclick="buyNow()" ${stock > 0 ? '' : 'disabled'}>Buy Now</button>`
            }
            <div class="card mt-3" style="padding:20px;">
              <h3 style="margin-bottom:10px;">Product Description</h3>
              <p style="color:var(--text-light);line-height:1.7;">${escapeHTML(p.description || 'No description available.')}</p>
            </div>
          </div>
        </div>
      `;
      if (window.OneSpeedBackend?.configured()) {
        await loadProductCommunity(p, authenticated);
      }
    });

    async function loadProductCommunity(product, authenticated) {
      const content = document.getElementById('product-content');
      try {
        const [reviews, user] = await Promise.all([
          OneSpeedBackend.listProductReviews(product.id),
          OneSpeedBackend.currentUser()
        ]);
        const average = reviews.length
          ? (reviews.reduce((sum, review) => sum + Number(review.rating), 0) / reviews.length).toFixed(1)
          : null;
        const reviewableOrders = user ? await OneSpeedBackend.listReviewableOrders(product.id) : [];
        const uniqueOrders = [...new Map(reviewableOrders.map(item => [item.order_id, item.orders])).entries()];
        const { data: wishlistRow, error: wishlistError } = user
          ? await OneSpeedBackend.client().from('wishlist_items').select('product_id')
            .eq('product_id', product.id).maybeSingle()
          : { data: null, error: null };
        if (wishlistError) throw wishlistError;

        const reviewsHTML = reviews.map(review => `
          <article class="product-review">
            <p class="review-rating" aria-label="${Number(review.rating)} out of 5 stars">${'★'.repeat(Number(review.rating))}${'☆'.repeat(5 - Number(review.rating))}</p>
            <p>${escapeHTML(review.body || 'No written comment.')}</p>
            <time datetime="${escapeHTML(review.created_at)}">${escapeHTML(new Date(review.created_at).toLocaleDateString())}</time>
          </article>`).join('');
        content.insertAdjacentHTML('beforeend', `
          <section class="product-community">
            <section class="card product-reviews">
              <h2>Customer reviews</h2>
              <p class="review-summary">${average ? `${average} / 5 from ${reviews.length} published review${reviews.length === 1 ? '' : 's'}` : 'No published customer reviews yet.'}</p>
              <div>${reviewsHTML || '<p>Verified-purchase reviews will appear here after moderation.</p>'}</div>
            </section>
            ${authenticated && uniqueOrders.length ? `
              <section class="card product-review-form">
                <h2>Review a purchase</h2>
                <form id="product-review-form">
                  <label>Completed order<select class="form-control" name="orderId" required>
                    ${uniqueOrders.map(([orderId, order]) => `<option value="${escapeHTML(orderId)}">${escapeHTML(order.order_number)}</option>`).join('')}
                  </select></label>
                  <label>Rating<select class="form-control" name="rating" required>
                    <option value="5">5 — Excellent</option><option value="4">4 — Very good</option>
                    <option value="3">3 — Good</option><option value="2">2 — Fair</option><option value="1">1 — Poor</option>
                  </select></label>
                  <label>Review<textarea class="form-control" name="body" maxlength="3000" rows="4"></textarea></label>
                  <button class="btn btn-primary" type="submit">Submit for review</button>
                  <p id="review-status" role="status"></p>
                </form>
              </section>` : ''}
          </section>`);

        if (authenticated) {
          const actions = content.querySelector('.product-detail > div:last-child');
          const wishlistButton = document.createElement('button');
          wishlistButton.type = 'button';
          wishlistButton.className = 'btn btn-secondary btn-block mt-2';
          let isSaved = Boolean(wishlistRow);
          wishlistButton.textContent = isSaved ? 'Remove from wishlist' : 'Save to wishlist';
          wishlistButton.addEventListener('click', async () => {
            wishlistButton.disabled = true;
            try {
              await OneSpeedBackend.setWishlisted(product.id, !isSaved);
              isSaved = !isSaved;
              wishlistButton.textContent = isSaved ? 'Remove from wishlist' : 'Save to wishlist';
              window.dispatchEvent(new Event('onespeed:wishlist-updated'));
              OSM.toast(isSaved ? 'Saved to wishlist' : 'Removed from wishlist');
            } catch (error) {
              OSM.toast(error.message || 'Could not update wishlist');
            } finally { wishlistButton.disabled = false; }
          });
          actions?.querySelector('.card')?.before(wishlistButton);
        }

        document.getElementById('product-review-form')?.addEventListener('submit', async event => {
          event.preventDefault();
          const form = event.currentTarget;
          const button = event.submitter;
          const status = document.getElementById('review-status');
          button.disabled = true;
          try {
            const values = new FormData(form);
            await OneSpeedBackend.createProductReview({
              productId: product.id,
              orderId: String(values.get('orderId')),
              rating: Number(values.get('rating')),
              body: String(values.get('body') || '').trim()
            });
            form.reset();
            status.textContent = 'Review submitted for moderation. It will appear after an administrator publishes it.';
          } catch (error) { status.textContent = error.message || 'Could not submit review.'; }
          finally { button.disabled = false; }
        });
      } catch (error) {
        const section = document.createElement('section');
        section.className = 'card page-state';
        section.textContent = `Customer reviews are temporarily unavailable: ${error.message || 'Please try again later.'}`;
        content.append(section);
      }
    }

    function changeQty(delta) {
      const input = document.getElementById('qty');
      if (!input) return;
      const max = Number(input.max);
      const current = Number.parseInt(input.value, 10) || 1;
      input.value = Math.min(max, Math.max(1, current + delta));
    }

    async function requireShoppingLogin() {
      if (window.OneSpeedBackend?.configured()) {
        try {
          const user = await OneSpeedBackend.currentUser();
          if (user) return true;
        } catch (error) {
          OSM.toast('Could not verify your account: ' + error.message);
          return false;
        }
        location.href = 'login.html?redirect=' + encodeURIComponent(location.pathname + location.search);
        return false;
      }
      return requireLogin();
    }

    async function addToCart() {
      if (!await requireShoppingLogin()) return;
      const id = getQueryParam('id');
      const input = document.getElementById('qty');
      const qty = Number.parseInt(input?.value, 10);
      if (!input || !Number.isInteger(qty) || qty < 1 || qty > Number(input.max)) {
        OSM.toast('Choose a valid quantity available in stock.');
        return;
      }
      OSM.addToCart(id, qty);
      updateCartBadge();
      OSM.toast(`Added ${qty} item(s) to cart`);
    }

    async function buyNow() {
      if (!await requireShoppingLogin()) return;
      const id = getQueryParam('id');
      const input = document.getElementById('qty');
      const qty = Number.parseInt(input?.value, 10);
      if (!input || !Number.isInteger(qty) || qty < 1 || qty > Number(input.max)) {
        OSM.toast('Choose a valid quantity available in stock.');
        return;
      }
      OSM.clearCart();
      OSM.addToCart(id, qty);
      location.href = 'checkout.html';
    }

    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[character]));
    }
  </script>
</body>
</html>
